<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الدليل المجاني</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            font-size: 22px;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .download-btn {
            background-color: #e91e63;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s ease;
        }
        .download-btn:hover {
            background-color: #c2185b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>تحميل دليل العناية بالذات المجاني 📖</h1>
        <p>اضغط على الزر أسفله للتحميل المباشر وتأكيد العملية.</p>
        <a href="#" id="downloadBtn" class="download-btn">Download Free PDF Guide</a>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();

            // 1. Direct Link ديال Adsterra
            var adsterraLink = "حط_رابط_ADSTERRA_DIRECT_LINK_هنا";

            // 2. اسم ملف الـ PDF اللي رفعتي فـ GitHub
            var pdfFileName = "Self-care-guide-2025.pdf";

            // فتح الإعلان فـ Tab جديد
            window.open(adsterraLink, '_blank');

            // تحميل الملف فـ النافذة الحالية
            window.location.href = pdfFileName;
        });
    </script>

</body>
</html>
