<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Self Care Guide PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .image-container {
            width: 100%;
            height: 240px;
            overflow: hidden;
            background-color: #f0f0f2;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 25px 20px;
        }

        .badge {
            display: inline-block;
            background-color: #e8f5e9;
            color: #2e7d32;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #1d1d1f;
            line-height: 1.3;
        }

        p {
            font-size: 14px;
            color: #86868b;
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #e91e63, #d81b60);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(233, 30, 99, 0.2);
        }

        .footer-note {
            margin-top: 15px;
            font-size: 11px;
            color: #a1a1a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <!-- غيّر رابط الصورة أسفله بالصورة التي تريدها -->
            <img src="https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?q=80&w=600&auto=format&fit=crop" alt="Self Care Guide Cover">
        </div>

        <div class="content">
            <span class="badge">Free Digital Guide</span>
            <h1>Self Care & Wellness Guide 2025</h1>
            <p>Download your free comprehensive guide packed with daily routines, mindfulness tips, and self-care strategies.</p>

            <a href="#" id="downloadBtn" class="btn">Download Free PDF Guide</a>

            <div class="footer-note">
                Instant PDF Download • No Registration Required
            </div>
        </div>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            e.preventDefault();

            // 1. ضع رابط Adsterra Direct Link هنا بين القوسين
            var adsterraLink = "حط_رابط_ADSTERRA_DIRECT_LINK_هنا";

            // 2. اسم ملف الـ PDF المرفوع على GitHub
            var pdfFileName = "Self-care-guide-2025.pdf";

            // فتح رابط الإعلان في تبويب جديد
            if (adsterraLink && adsterraLink !== "حط_رابط_ADSTERRA_DIRECT_LINK_هنا") {
                window.open(adsterraLink, '_blank');
            }

            // تحميل الملف مباشرة في النافذة الحالية
            window.location.href = pdfFileName;
        });
    </script>

</body>
</html>
