<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل الدليل المجاني</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 380px;
            width: 88%;
        }
        h1 { color: #222; font-size: 20px; margin-bottom: 12px; }
        p { color: #666; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .btn {
            background-color: #e91e63;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
        .secondary-btn {
            background-color: #2196F3;
        }
        #step2 { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- الخطوة الأولى: رابط Adsterra -->
        <div id="step1">
            <h1>دليل العناية بالذات المجاني 📖</h1>
            <p>اضغط أسفله للانتقال لصفحة التحميل المباشر.</p>
            <a href="حط_رابط_ADSTERRA_هنا" target="_blank" id="adBtn" class="btn">Click Here to Unlock Download</a>
        </div>

        <!-- الخطوة الثانية: تحميل الـ PDF مباشرة -->
        <div id="step2">
            <h1>تم تجهيز الملف بنجاح! ✅</h1>
            <p>اضغط على الزر أسفله لتنزيل ملف الـ PDF مباشرة على هاتفك.</p>
            <a href="./Self-care-guide-2025.pdf" download class="btn secondary-btn">Download PDF Now 📥</a>
        </div>
    </div>

    <script>
        document.getElementById('adBtn').addEventListener('click', function() {
            setTimeout(function() {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }, 800);
        });
    </script>

</body>
</html>
